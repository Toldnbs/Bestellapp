<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestellapp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Palanquin+Dark:wght@400;700&family=Palanquin:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="./scripts/menu.js"></script>
    <script defer src="./scripts/template.js"></script>
    <script defer src="./script.js"></script>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a class="logo" href="#">
          <img src="./assets/icons/logo.svg" alt="Logo" />
          <div class="logo-text">
            <p>Bestell</p>
            <p>App</p>
          </div>
        </a>
        <button class="menu-button">
          <img src="./assets/icons/menu.svg" alt="Menu" />
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <img class="hero-image" src="./assets/img/hero.jpg" alt="Burgers and pizza" />
        <img class="restaurant-logo" src="./assets/img/restaurant-logo.png" alt="BurgerHouse" />
      </section>

      <section class="restaurant-info">
        <div class="restaurant-row">
          <h1><span>Burger</span>House</h1>
          <div class="rating">
            <img src="./assets/icons/star.svg" alt="Star" />
            <p>4,1</p>
            <p>(317)</p>
          </div>
        </div>
        <p class="restaurant-text">
          The best of Burgers, Pizza, and Greens, all in one great place.
        </p>
      </section>
    </main>
  </body>
</html>
