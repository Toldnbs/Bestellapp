<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestellapp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Palanquin+Dark:wght@400;700&family=Palanquin:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <script defer src="./scripts/menu.js"></script>
    <script defer src="./scripts/template.js"></script>
    <script defer src="./script.js"></script>
  </head>

  <body>
    <header>
      <div class="header-inner">
        <a class="logo" href="#">
          <img class="logo-icon" src="./assets/icons/logo.svg" alt="Logo" />
          <div class="logo-text">
            <p>Bestell</p>
            <p>App</p>
          </div>
          <img class="logo-mobile" src="./assets/icons/logo-mobile.svg" alt="BestellApp" />
        </a>
        <button class="menu-button">
          <img src="./assets/icons/menu.svg" alt="Menu" />
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <img class="hero-image" src="./assets/img/hero.jpg" alt="Burgers and pizza" />
        <img class="restaurant-logo" src="./assets/img/restaurant-logo.png" alt="BurgerHouse" />
      </section>

      <section class="restaurant-info">
        <div class="restaurant-row">
          <h1><span>Burger</span>House</h1>
          <div class="rating">
            <img src="./assets/icons/star.svg" alt="Star" />
            <p>4,1</p>
            <p>(317)</p>
          </div>
        </div>
        <p class="restaurant-text">
          The best of Burgers, Pizza, and Greens, all in one great plac.
        </p>
      </section>

      <div class="menu">
        <section class="category">
          <div class="category-inner">
            <img class="category-icon" src="./assets/icons/category-burger.png" alt="Burger" />
            <h2>Burger <span class="long-title">&amp; Sandwiches</span></h2>
          </div>
        </section>
        <div class="meal-list" id="burger-list"></div>

        <section class="category">
          <div class="category-inner">
            <img class="category-icon" src="./assets/icons/category-pizza.png" alt="Pizza" />
            <h2>Pizza <span class="pizza-size">(30cm)</span></h2>
          </div>
        </section>
        <div class="meal-list" id="pizza-list"></div>

        <section class="category">
          <div class="category-inner">
            <img class="category-icon" src="./assets/icons/category-salad.png" alt="Salad" />

            <h2>Salad</h2>
          </div>
        </section>

        <div class="meal-list" id="salad-list"></div>

        <div class="basket-wrapper">
          <aside class="basket">
            <h2>Your Basket</h2>

            <div id="basket-content"></div>
          </aside>
        </div>
      </div>
    </main>

    <footer>
      <div class="copyright">
        <img src="./assets/icons/copyright.svg" alt="Copyright" />
        <p>2025 BurgerHouse</p>
      </div>
      <a href="#">Imprint</a>
      <a href="#">Cookie Preferences</a>
    </footer>

    <nav class="mobile-nav">
      <button>
        <img src="./assets/icons/nav-home.svg" alt="Home" />
      </button>
      <button>
        <img src="./assets/icons/nav-profile.svg" alt="Profile" />
      </button>
      <button>
        <img src="./assets/icons/nav-orders.svg" alt="Orders" />
      </button>
      <button>
        <img src="./assets/icons/nav-basket.svg" alt="Basket" />
      </button>
    </nav>

    <dialog class="confirmation" id="confirmation">
      <button class="close-button" onclick="closeConfirmation()">
        <img src="./assets/icons/close.svg" alt="Close" />
      </button>
      <div class="confirmation-content">
        <img class="confirmation-image" src="./assets/img/delivery-truck.png" alt="Delivery truck" />
        <div>
          <h2>Order confirmed!</h2>
          <p>Your food is on the way!</p>
        </div>
      </div>
    </dialog>
  </body>
</html>
